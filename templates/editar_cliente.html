{% extends "base.html" %}
{% block title %}Editar Cliente{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-dashboard">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Dirección</label>
                        <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion or '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a href="/clientes" class="btn btn-secondary"><i class="bi bi-x-lg"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
