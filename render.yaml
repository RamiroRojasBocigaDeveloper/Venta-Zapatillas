services:
  - type: web
    name: ventas-zapatillas
    runtime: python
    region: oregon
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Ahora el usuario debe proveerla manualmente desde filess.io
      - key: DEBUG
        value: "false"
      - key: HTTPS_ONLY
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
