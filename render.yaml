services:
  - type: web
    name: ventas-zapatillas
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Ahora el usuario debe proveerla manualmente desde filess.io
      - key: DEBUG
        value: "false"
      - key: HTTPS_ONLY
        value: "true"
